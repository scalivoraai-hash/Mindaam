name: Mindaam GCP deployment
on:
  workflow_run:
    workflows: [Validation]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      operation:
        description: Resume at this step (foundation creates paid startup resources)
        type: choice
        options: [foundation, staging, verify, review, production, finalize, rollback]
        required: true
      release_profile:
        description: Expiring owner-requested beta policy; payments remain server-gated
        type: choice
        options: [limited-public-beta-v1, full]
        default: limited-public-beta-v1
      release_sha:
        description: Existing source SHA for resume/verify/production/finalize/rollback; empty uses current main
        type: string
      review_object:
        description: Private release-review object prepared after actual staging cost review (production only)
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: mindaam-gcp-release
  cancel-in-progress: false
jobs:
  validate:
    if: >-
      github.repository == 'scalivoraai-hash/Mindaam' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s infrastructure/gcp/tests -v
      - name: Validate automatic staging trigger and current main
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python infrastructure/gcp/staging_trigger.py
      - name: Require existing successful application CI with matching source
        env:
          GH_TOKEN: ${{ github.token }}
        run: python infrastructure/gcp/source_gate.py
  deploy:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      MINDAAM_PROJECT_ID: ${{ vars.MINDAAM_PROJECT_ID }}
      MINDAAM_BUDGET_CONFIRMED: ${{ vars.MINDAAM_BUDGET_CONFIRMED }}
      RELEASE_PROFILE: ${{ inputs.release_profile || 'limited-public-beta-v1' }}
      OPERATION: ${{ inputs.operation || 'staging' }}
      RELEASE_SHA: ${{ inputs.release_sha || github.event.workflow_run.head_sha || github.sha }}
      REVIEW_OBJECT: ${{ inputs.review_object }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.MINDAAM_WIF_PROVIDER }}
          service_account: ${{ vars.MINDAAM_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
        with:
          version: '>= 550.0.0'
      - name: Reject an outdated automatic staging release
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python infrastructure/gcp/staging_trigger.py
      - name: Resume selected operation
        run: python infrastructure/gcp/workflow.py
      - name: Inspect existing staging owner without changing accounts
        if: env.OPERATION == 'staging'
        run: |
          gcloud run jobs execute mindaam-migrate-staging --project "$MINDAAM_PROJECT_ID" --region europe-west2 --args=-m,backend.api.owner_access --wait --format=json > owner-inspection-execution.json
          python - <<'PYOWNER'
          import json, subprocess
          execution = json.load(open('owner-inspection-execution.json'))['metadata']['name']
          query = 'resource.type="cloud_run_job" AND labels."run.googleapis.com/execution_name"="' + execution + '" AND textPayload:"MINDAAM_OWNER_INSPECTION"'
          result = subprocess.run(['gcloud','logging','read',query,'--project','mindaam','--limit','5','--format=json'],check=True,capture_output=True,text=True)
          with open('owner-inspection-result.json','w') as f: f.write(result.stdout)
          PYOWNER
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: env.OPERATION == 'staging' || env.OPERATION == 'verify'
        with:
          node-version: '24'
      - name: Install remote acceptance browser
        if: env.OPERATION == 'staging' || env.OPERATION == 'verify'
        run: |
          npm install --prefix /tmp/mindaam-qa --no-save playwright@1.62.1
          /tmp/mindaam-qa/node_modules/.bin/playwright install --with-deps chromium
      - name: Actual staging multiplayer, media and forced TURN over TLS
        if: env.OPERATION == 'staging' || env.OPERATION == 'verify'
        env:
          QA_NODE_MODULES: /tmp/mindaam-qa/node_modules
          QA_STAGING_HOST_IDENTIFIER: ${{ secrets.MINDAAM_STAGING_QA_HOST_IDENTIFIER }}
          QA_STAGING_HOST_PASSWORD: ${{ secrets.MINDAAM_STAGING_QA_HOST_PASSWORD }}
          QA_STAGING_MAX_RESERVATION_PC: ${{ vars.MINDAAM_STAGING_QA_MAX_RESERVATION_PC }}
        run: |
          node infrastructure/gcp/browser.cjs
          QA_FORCE_TURN=1 node infrastructure/gcp/browser.cjs
          python infrastructure/gcp/evidence.py --project "$MINDAAM_PROJECT_ID" --sha "$RELEASE_SHA"
      - name: Persist non-secret evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gcp-${{ env.OPERATION }}-${{ github.run_id }}
          path: |
            deployment-result.json
            smoke-result.json
            owner-inspection-result.json
            gcp-evidence/
          retention-days: 14
          if-no-files-found: ignore
