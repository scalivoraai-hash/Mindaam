name: GCP deployment validation
on:
  push:
    paths: ['infrastructure/gcp/**', '.github/workflows/gcp-*.yml']
  pull_request:
    paths: ['infrastructure/gcp/**', '.github/workflows/gcp-*.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: mindaam_staging
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: deployment-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d mindaam_staging"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: |
          python -m compileall -q infrastructure/gcp
          python -m unittest discover -s infrastructure/gcp/tests -v
          node --check infrastructure/gcp/browser.cjs
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
        with:
          version: '>= 550.0.0'
      - name: Check deployment CLI flags without authenticating
        run: python infrastructure/gcp/validate_cli.py
      - name: Validate actual pinned media container configuration
        run: python infrastructure/gcp/validate_containers.py
      - name: Build new GCP image packaging
        run: docker build -f infrastructure/gcp/Dockerfile -t mindaam-gcp-validation .
      - name: Exercise the new migration job and restricted runtime role
        run: |
          docker run --rm --network host -e APP_ENV=staging -e DATABASE_URL=postgresql+psycopg://postgres:deployment-ci-only@127.0.0.1:5432/mindaam_staging -e RUNTIME_DATABASE_URL=postgresql+psycopg://mindaam_staging:runtime-ci-only@127.0.0.1:5432/mindaam_staging mindaam-gcp-validation python infrastructure/gcp/migrate.py
          docker run --rm --network host -v "$PWD/infrastructure/gcp/tests/check_sql_role.py:/tmp/check_sql_role.py:ro" mindaam-gcp-validation python /tmp/check_sql_role.py
      - name: Verify owner recovery against existing identity implementation
        run: docker run --rm -e APP_ENV=test -e PYTHONPATH=/app -v "$PWD/infrastructure/gcp:/tmp/gcp-tests:ro" mindaam-gcp-validation python /tmp/gcp-tests/tests/check_owner_recovery.py -v
