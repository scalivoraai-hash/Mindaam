# Render key/secret from Secret Manager on the VM into /run/mindaam/livekit.yaml.
# Keep this file and certificates outside Git. No LiveKit Cloud endpoint.
port: 7880
bind_addresses: ['127.0.0.1']
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50200
  use_external_ip: true
keys:
  '${LIVEKIT_API_KEY}': '${LIVEKIT_API_SECRET}'
turn:
  enabled: true
  domain: media.mindaam.com
  tls_port: 5349
  udp_port: 3478
  cert_file: /certs/fullchain.pem
  key_file: /certs/privkey.pem
logging:
  level: warn
