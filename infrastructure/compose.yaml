name: pulseworld
services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: pulseworld
      POSTGRES_USER: pulseworld
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U pulseworld -d pulseworld']
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.api
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://pulseworld:${POSTGRES_PASSWORD}@postgres:5432/pulseworld
    working_dir: /app
    command: [alembic, -c, backend/alembic.ini, upgrade, head]
    depends_on:
      postgres:
        condition: service_healthy
  api:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.api
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://pulseworld:${POSTGRES_PASSWORD}@postgres:5432/pulseworld
      REDIS_URL: redis://redis:6379/0
    ports: ['127.0.0.1:8000:8000']
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
  web:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.web
      args:
        API_INTERNAL_URL: http://api:8000
    ports: ['127.0.0.1:3000:3000']
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres-data:
  redis-data:
